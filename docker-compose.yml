services:
  laya:
    build: ./server
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      LAYA_PRELOAD: ${LAYA_PRELOAD:-0}
      LAYA_MODELS: ${LAYA_MODELS:-}
    volumes:
      - laya-hf-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  laya-hf-cache:
